<meta charset="utf-8">
<title>Compliance Tracker &amp; Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: fixed top app-bar + left stage/filter rail on desktop, collapsing
   to a bottom tab bar on phone; content is a single scrollable column of cards. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eceff2; --border:#d8dee4;
  --text:#192230; --text-muted:#5b6676; --accent:#2b4a73; --accent-ink:#ffffff;
  --ok:#1c7a4d; --ok-bg:#e4f5ec; --warn:#9a6b00; --warn-bg:#fdf1d8;
  --bad:#b3261e; --bad-bg:#fbe7e5; --hold:#5b4b8a; --hold-bg:#ece7f6;
  --neutral:#5b6676; --neutral-bg:#e9ebee;
  --font-display:'Public Sans',system-ui,sans-serif; --font-body:'Public Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#171d25; --surface-2:#1e2630; --border:#2b3440;
    --text:#e7ebef; --text-muted:#99a4b2; --accent:#7ca3d6; --accent-ink:#0d1117;
    --ok:#5fd394; --ok-bg:#163428; --warn:#e8b94e; --warn-bg:#3a2e0f;
    --bad:#f08b85; --bad-bg:#3a1c1a; --hold:#b7a6e6; --hold-bg:#2a2340;
    --neutral:#99a4b2; --neutral-bg:#232b35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#171d25; --surface-2:#1e2630; --border:#2b3440;
  --text:#e7ebef; --text-muted:#99a4b2; --accent:#7ca3d6; --accent-ink:#0d1117;
  --ok:#5fd394; --ok-bg:#163428; --warn:#e8b94e; --warn-bg:#3a2e0f;
  --bad:#f08b85; --bad-bg:#3a1c1a; --hold:#b7a6e6; --hold-bg:#2a2340;
  --neutral:#99a4b2; --neutral-bg:#232b35;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--text);
  padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px));
  font-size:14px; line-height:1.45;
}
a{color:var(--accent);}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  position:sticky; top:0; align-self:flex-start; height:100vh; width:220px; flex-shrink:0; z-index:30;
  background:var(--surface); border-right:1px solid var(--border);
  padding:16px 12px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; padding:0 6px;}
.brand .logo{height:28px; width:auto; display:block; object-fit:contain;}
.tabs{display:flex; flex-direction:column; gap:2px; flex:1;}
.tab{
  padding:9px 12px; border-radius:8px; border:1px solid transparent; background:transparent;
  color:var(--text-muted); font-size:13px; font-weight:600; text-align:left; width:100%;
}
.tab.active{background:var(--accent); color:var(--accent-ink);}
.tab:not(.active):hover{background:var(--surface-2); color:var(--text);}
.content{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;
}
.topbar-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
select.pill, .pill-btn, .pill{
  padding:6px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:12.5px;
}
main{flex:1; padding:18px 16px 40px; max-width:1280px; margin:0 auto; width:100%;}
@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{position:static; height:auto; width:100%; border-right:none; border-bottom:1px solid var(--border); padding:10px 12px; gap:8px;}
  .tabs{flex-direction:row; flex-wrap:wrap;}
  .tab{width:auto;}
  .topbar{position:static; justify-content:flex-start;}
}

.view{display:none;}
.view.active{display:block;}

/* ---------- generic components ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;}
.grid{display:grid; gap:14px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:4px;}
.stat-tile .num{font-family:var(--font-mono); font-size:26px; font-weight:700;}
.stat-tile .label{color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
.badge.ok{background:var(--ok-bg); color:var(--ok);}
.badge.warn{background:var(--warn-bg); color:var(--warn);}
.badge.bad{background:var(--bad-bg); color:var(--bad);}
.badge.hold{background:var(--hold-bg); color:var(--hold);}
.badge.neutral{background:var(--neutral-bg); color:var(--neutral);}
.badge .ic{font-size:10px;}

.proposed-flag{display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:6px; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}

/* ---------- Dashboard ---------- */
.dash-cols{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:760px){.dash-cols{grid-template-columns:1fr;}}
.bar-row{display:flex; align-items:center; gap:10px; margin:8px 0;}
.bar-row .lbl{width:120px; font-size:12px; color:var(--text-muted); flex-shrink:0;}
.bar-track{flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex;}
.bar-seg{height:100%;}
.bar-row .pct{width:42px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-muted);}
table.simple{width:100%; border-collapse:collapse; font-size:12.5px;}
table.simple th{text-align:left; color:var(--text-muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
table.simple td{padding:7px 8px; border-bottom:1px solid var(--border);}
table.simple tr:last-child td{border-bottom:none;}

/* ---------- Stage view ---------- */
.stage-block{border:1px solid var(--border); border-radius:12px; margin-bottom:14px; background:var(--surface); overflow:hidden;}
.stage-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; background:var(--surface);}
.stage-head:hover{background:var(--surface-2);}
.stage-head h3{font-size:15px; flex:1; min-width:0;}
.stage-chevron{transition:transform .15s; color:var(--text-muted);}
.stage-block.open .stage-chevron{transform:rotate(90deg);}
.stage-progress{width:120px; flex-shrink:0;}
.stage-count{font-family:var(--font-mono); font-size:12px; color:var(--text-muted); white-space:nowrap;}
.stage-items{display:none; border-top:1px solid var(--border);}
.stage-block.open .stage-items{display:block;}
.item-row{display:grid; grid-template-columns:90px 1fr 140px 130px 110px 100px; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); font-size:12.5px;}
.item-row:last-child{border-bottom:none;}
.item-row:hover{background:var(--surface-2); cursor:pointer;}
.item-row .idcell{font-family:var(--font-mono); font-weight:700; font-size:12px;}
.item-row .desc{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-row .muted{color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
@media (max-width:860px){
  .item-row{grid-template-columns:1fr; gap:4px;}
  .item-row>div::before{content:attr(data-lbl); display:block; font-size:10px; color:var(--text-muted); text-transform:uppercase;}
}
.item-row-header{display:grid; grid-template-columns:90px 1fr 140px 130px 110px 100px; gap:10px; padding:8px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); background:var(--surface-2); border-top:1px solid var(--border);}
@media (max-width:860px){.item-row-header{display:none;}}

/* ---------- Calendar ---------- */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.cal-dow{background:var(--surface-2); text-align:center; font-size:11px; padding:6px 0; color:var(--text-muted); text-transform:uppercase;}
.cal-cell{background:var(--surface); min-height:90px; padding:6px; font-size:11px; display:flex; flex-direction:column; gap:3px;}
.cal-cell.off{background:var(--surface-2); color:var(--text-muted);}
.cal-cell .dnum{font-family:var(--font-mono); font-size:11px; color:var(--text-muted);}
.cal-cell.today .dnum{color:var(--accent); font-weight:800;}
.cal-chip{border-radius:5px; padding:2px 5px; font-size:10.5px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-more{font-size:10px; color:var(--text-muted);}
.undated-panel{margin-top:16px;}
.undated-chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; margin:3px; font-size:12px; cursor:pointer; background:var(--surface);}

/* ---------- Register table ---------- */
.register-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
.register-toolbar input[type=text]{flex:1; min-width:180px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px;}
table.register{width:100%; border-collapse:collapse; font-size:12px; min-width:900px;}
table.register th{position:sticky; top:0; background:var(--surface-2); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; font-size:10.5px; text-transform:uppercase; color:var(--text-muted);}
table.register td{padding:7px 10px; border-bottom:1px solid var(--border); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
table.register tr:hover td{background:var(--surface-2); cursor:pointer;}
.col-chooser{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.col-chooser label{font-size:11.5px; display:flex; gap:4px; align-items:center; background:var(--surface-2); border-radius:6px; padding:3px 8px;}

/* ---------- Data quality ---------- */
.dq-group{margin-bottom:18px;}
.dq-group h3{font-size:14px; margin-bottom:8px;}
.dq-list{display:flex; flex-direction:column; gap:1px; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.dq-item{display:flex; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--surface); font-size:12.5px; cursor:pointer;}
.dq-item:hover{background:var(--surface-2);}

/* ---------- Drawer ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; display:none;}
.overlay.show{display:block;}
.drawer{
  position:fixed; top:50%; left:50%; width:min(820px,94vw); max-height:90vh; background:var(--surface); z-index:41;
  transform:translate(-50%,-48%) scale(.98); opacity:0; visibility:hidden; transition:opacity .15s ease, transform .15s ease, visibility .15s;
  overflow-y:auto; border:1px solid var(--border); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  padding:0;
}
.modal-head{position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:flex-start; padding:18px 22px 14px; background:var(--surface); border-bottom:1px solid var(--border);}
.modal-head .drawer-close{position:static; flex-shrink:0;}
.modal-badges{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px;}
.modal-id{font-weight:700; font-size:13px; background:var(--accent); color:var(--accent-ink); padding:3px 9px; border-radius:6px;}
.modal-title{font-size:16px; line-height:1.4; font-weight:600;}
.modal-body{padding:18px 22px 26px; background:var(--bg); display:flex; flex-direction:column; gap:14px;}
.modal-grid{display:grid; grid-template-columns:1.25fr 1fr; gap:14px; align-items:start;}
@media (max-width:760px){.modal-grid{grid-template-columns:1fr;}}
.modal-col{display:flex; flex-direction:column; gap:14px; min-width:0;}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
.panel>h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 10px; font-family:var(--font-display);}
.prose{font-size:13.5px; line-height:1.6; white-space:pre-wrap;}
.prose-meta{margin-top:12px; padding-top:10px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text-muted);}
.prose-meta b{color:var(--text);}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:520px){.facts{grid-template-columns:1fr;}}
.fact{background:var(--surface-2); border-radius:9px; padding:9px 11px; min-width:0;}
.fact-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:3px; font-weight:600;}
.fact-val{font-size:13px; font-weight:600; overflow-wrap:anywhere;}
.fact-val select{font-weight:500; font-size:12px; padding:5px 6px; width:100%; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.fact-sub{font-size:11px; color:var(--text-muted); margin-top:2px; overflow-wrap:anywhere;}
.drawer.show{transform:translate(-50%,-50%) scale(1); opacity:1; visibility:visible;}
.drawer-close{position:absolute; top:14px; right:14px; background:var(--surface-2); border:none; border-radius:8px; width:30px; height:30px; font-size:16px; color:var(--text);}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 22px;}
.detail-grid .wide{grid-column:1 / -1;}
@media (max-width:640px){.detail-grid{grid-template-columns:1fr;}}
.doc-check{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--border);}
.doc-check:last-child{border-bottom:none;}
.doc-check .st{width:18px; text-align:center; font-weight:700;}
.doc-check.done .st{color:var(--ok);}
.doc-check.pending .st{color:var(--text-muted);}
.doc-upload{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px;}
.doc-upload select{flex:2 1 220px; width:auto;}
.doc-upload input[type=file]{flex:2 1 200px; width:auto;}
.doc-file{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.doc-file:last-child{border-bottom:none;}
.doc-file .meta{color:var(--text-muted); font-size:11.5px;}
.btn.sm{padding:4px 10px; font-size:11.5px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-bottom:4px;}
.field .val{font-size:13px; white-space:pre-wrap;}
.field textarea, .field input, .field select{width:100%; padding:7px 9px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.drawer-section{border-top:1px solid var(--border); margin-top:16px; padding-top:14px;}
.btn{padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:600; font-size:12.5px;}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.audit-entry{font-size:11.5px; padding:6px 0; border-bottom:1px solid var(--border); color:var(--text-muted);}
.audit-entry:last-child{border-bottom:none;}
.audit-entry b{color:var(--text);}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-muted);}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:12.5px; z-index:60; opacity:0; transition:opacity .2s;}
.toast.show{opacity:1;}
.readonly-note{font-size:11.5px; color:var(--text-muted); background:var(--surface-2); border-radius:8px; padding:8px 10px; margin-bottom:10px;}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin:10px 0;}
.legend span{display:inline-flex; align-items:center; gap:4px;}
.legend i{width:9px;height:9px;border-radius:50%; display:inline-block;}
</style>

  <aside class="sidebar">
    <div class="brand"><img class="logo" src="images/nyati%20logo.avif" alt="Nyati">Compliance Tracker</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="dashboard">Dashboard</button>

    <div class="topbar">
      <div class="topbar-right">

        <span class="pill" id="userChip" style="cursor:default;"></span>
        <button class="pill" id="logoutBtn" type="button">Sign out</button>
      </div>

    <main id="main"></main>

</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= STATE ============================= */
const S = {
  items: [], stages: [],
  tracking: {},        // key -> doc data
  audit: {},           // compliance_id (or key) -> [entries]
  projects: {},        // id -> {name, rera_no, current_stage, notes}
  stageOverrides: {},  // compliance_id -> stage_id
  currentProject: 'ENTITY',
  role: 'readonly',   // set from the signed-in user at boot; the server enforces it too
  view: 'dashboard',
  calMonth: new Date(),
  registerCols: ['compliance_id','department','level','brief_description','authority_norm','frequency_norm','owner','status'],
};
let db=null;

const STATUS_DEFS = {
  'Not Started':   {cls:'neutral', ic:'○'},
  'In Progress':   {cls:'warn', ic:'◐'},
  'Submitted / Under Review': {cls:'hold', ic:'◑'},
  'Compliant / Completed': {cls:'ok', ic:'✓'},
  'Overdue':       {cls:'bad', ic:'!'},
  'Not Applicable':{cls:'neutral', ic:'—'},
  'On Hold':       {cls:'hold', ic:'❙❙'},
};
const STATUS_LIST = Object.keys(STATUS_DEFS);

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

/* ============================= DATA LOAD ============================= */
async function loadData(){
  const [itemsRes, stagesRes] = await Promise.all([fetch('items.json'), fetch('stages.json')]);
  S.items = await itemsRes.json();
  S.stages = await stagesRes.json();
}

function trackingKey(item, projectId){
  return item.level === 'Project Level' ? `${item.compliance_id}__${projectId||S.currentProject}` : item.compliance_id;
}
function getTracking(item, projectId){
  const k = trackingKey(item, projectId);
  return S.tracking[k] || {status:'Not Started', status_date:null, last_updated_by:null, remarks:'', evidence_link:'', next_due_date: item.due_date_parse_value && item.due_date_parse_type==='fixed_date' ? item.due_date_parse_value : null};
}
function effectiveStatus(item, projectId){
  const tr = getTracking(item, projectId);
  let status = tr.status || 'Not Started';
  if(status !== 'Compliant / Completed' && status !== 'Not Applicable' && status !== 'On Hold' && tr.next_due_date){
    const d = daysUntil(tr.next_due_date);
    if(d !== null && d < 0) status = 'Overdue';
  }
  return status;
}
function effectiveStageId(item){
  return S.stageOverrides[item.compliance_id] || item.stage_id;
}

/* ============================= API DB ============================= */
// Talks to server/server.js (which stores data in MongoDB). Polls so other users' changes appear.
let ME = null;   // {email, name, role} of the signed-in user

async function api(method, url, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: method==='GET' ? undefined : JSON.stringify(body||{})});
  if(r.status===401){ location.href = '/login.html'; throw new Error('not signed in'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(j.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return j;
}

function makeApiDb(){
  const subs = [];
  const notify = ()=>subs.slice().forEach(fn=>fn());
  setInterval(notify, 5000);

  function query(name, params){
    const mk = p=>query(name, Object.assign({}, params, p));
    return {
      where(f, op, v){ return mk({key:v}); },
      orderBy(f, dir){ return mk({orderBy:f, dir:dir||'asc'}); },
      limit(n){ return mk({limit:n}); },
      onSnapshot(cb, errCb){
        let alive = true, last = null;
        const run = ()=>api('GET', '/api/'+name+'?'+new URLSearchParams(params))
          .then(rows=>{
            // Only notify on real changes: each callback re-renders the page, which would wipe half-typed forms.
            const sig = JSON.stringify(rows);
            if(!alive || sig === last) return;
            last = sig;
            cb({docs: rows.map(r=>({id:r.id, data:()=>r.data}))});
          })
          .catch(e=>{ if(alive && errCb) errCb(e); });
        subs.push(run); run();
        return ()=>{ alive=false; const i=subs.indexOf(run); if(i>=0) subs.splice(i,1); };
      }
    };
  }
  return {
    collection(name){
      const q = query(name, {});
      q.add = async data=>{ await api('POST', '/api/'+name, data); notify(); };
      return q;
    },
    doc(path){
      const [name, ...rest] = path.split('/');
      return { async set(data){ await api('PUT', '/api/'+name+'/'+encodeURIComponent(rest.join('/')), data); notify(); } };
    }
  };
}

function download(filename, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type: mime}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ============================= DB WIRING ============================= */
async function initCapabilities(){
  db = makeApiDb();

  // Subscribe to shared collections.
  db.collection('tracking').onSnapshot(snap=>{
    snap.docs.forEach(d=>{ S.tracking[d.id] = d.data(); });
    render();
  }, e=>console.warn('tracking sub error', e));

  db.collection('projects').onSnapshot(snap=>{
    const p={};
    snap.docs.forEach(d=>{ p[d.id]=d.data(); });
    S.projects = p;
    populateProjectSelect();
    render();
  }, e=>console.warn('projects sub error', e));

  db.collection('stage_overrides').onSnapshot(snap=>{
    const o={};
    snap.docs.forEach(d=>{ o[d.id]=d.data().stage_id; });
    S.stageOverrides = o;
    render();
  }, e=>console.warn('stage_overrides sub error', e));
}

function subscribeAudit(complianceId, projectId, cb){
  if(!db) { cb([]); return ()=>{}; }
  const key = projectId ? `${complianceId}__${projectId}` : complianceId;
  return db.collection('audit').where('key','==',key).orderBy('at','desc').limit(25).onSnapshot(snap=>{
    cb(snap.docs.map(d=>d.data()));
  }, e=>{ console.warn('audit sub', e); cb([]); });
}

async function saveTracking(item, projectId, patch){
  if(!db){ toast('Not saved — storage unavailable in this preview.'); return; }
  const key = trackingKey(item, projectId);
  const prev = getTracking(item, projectId);
  const who = ME.name; // the server also stamps this; the browser can't set it
  const next = {...prev, ...patch, last_updated_by: who, updated_at: new Date().toISOString()};
  try{
    await db.doc('tracking/'+key).set(next);
    if(patch.status && patch.status !== prev.status){
      await db.collection('audit').add({
        key, compliance_id: item.compliance_id, project_id: item.level==='Project Level' ? (projectId||S.currentProject) : null,
        old_status: prev.status || 'Not Started', new_status: patch.status, who, remark: patch.remarks || '', at: new Date().toISOString()
      });
    }
    S.tracking[key] = next;
    toast('Saved.');
  }catch(e){
    console.warn(e);
    toast('Save failed: '+(e && e.message || 'error'));
  }
}

async function saveProject(id, data){
  if(!db){ toast('Not saved — storage unavailable in this preview.'); return; }
  try{
    await db.doc('projects/'+id).set(data);
    S.projects[id]=data;
    populateProjectSelect();
    toast('Project saved.');
    render();
  }catch(e){ toast('Save failed: '+(e&&e.message||'error')); }
}

async function saveStageOverride(complianceId, stageId){
  if(!db){ toast('Not saved — storage unavailable in this preview.'); return; }
  try{
    await db.doc('stage_overrides/'+complianceId).set({stage_id: stageId, set_by: ME.name, at:new Date().toISOString()});
    S.stageOverrides[complianceId]=stageId;
    toast('Stage mapping updated.');
    render();
  }catch(e){ toast('Save failed: '+(e&&e.message||'error')); }
}

/* ============================= RENDER ROUTER ============================= */
function switchView(v){
  S.view = v;
  if(v==='users' && !S.users) loadUsers();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  render();
}

function render(){
  const main = document.getElementById('main');
  let html = '';
  if(S.items.length===0){ main.innerHTML = '<div class="empty-state">Loading compliance data…</div>'; return; }
  switch(S.view){
    case 'dashboard': html = renderDashboard(); break;
    case 'stages': html = renderStages(); break;
    case 'calendar': html = renderCalendar(); break;
    case 'register': html = renderRegister(); break;
    case 'projects': html = renderProjects(); break;
    case 'dq': html = renderDQ(); break;
    case 'users': html = renderUsers(); break;
    case 'settings': html = renderSettings(); break;
  }
  main.innerHTML = html;
  attachViewHandlers();
}

/* ============================= DASHBOARD ============================= */
function visibleItemsForProject(){
  // Items visible for current tracking context: entity items always, project items only when a real project selected.
  if(S.currentProject==='ENTITY') return S.items.filter(i=>i.level!=='Project Level');
  return S.items; // show both, project-level tracked against the selected project
}

function renderDashboard(){
  const items = S.items;
  const counts = {}; STATUS_LIST.forEach(s=>counts[s]=0);
  let overdue=0, due7=0, due30=0;
  items.forEach(it=>{
    const projCtx = it.level==='Project Level' ? S.currentProject : null;
    const st = effectiveStatus(it, projCtx);
    counts[st] = (counts[st]||0)+1;
    if(st==='Overdue') overdue++;
    const tr = getTracking(it, projCtx);
    if(tr.next_due_date && st!=='Compliant / Completed' && st!=='Not Applicable'){
      const d = daysUntil(tr.next_due_date);
      if(d!==null && d>=0 && d<=7) due7++;
      if(d!==null && d>=0 && d<=30) due30++;
    }
  });
  const total = items.length;
  const completed = counts['Compliant / Completed']||0;

  function pctBar(label, done, total, extra, color){
    const raw = total? done/total*100 : 0;
    const pct = raw.toFixed(2);
    // Keep a visible sliver for non-zero counts so a single item doesn't look empty.
    const width = done>0 ? Math.max(raw, 1.5) : 0;
    const countTxt = extra ? ` <span style="color:var(--text-muted)">(${done})</span>` : '';
    return `<div class="bar-row"><div class="lbl" title="${esc(label)}">${esc(label)}</div>
      <div class="bar-track"><div class="bar-seg" style="width:${width}%; background:${color||'var(--accent)'}"></div></div>
      <div class="pct">${pct}%${countTxt}</div></div>`;
  }

  const byDept = {};
  items.forEach(it=>{ byDept[it.department]=byDept[it.department]||{done:0,total:0}; byDept[it.department].total++;
    const projCtx = it.level==='Project Level' ? S.currentProject : null;
    if(effectiveStatus(it,projCtx)==='Compliant / Completed') byDept[it.department].done++; });

  const byStage = {};
  S.stages.forEach(s=>byStage[s.id]={done:0,total:0,name:s.name});
  items.forEach(it=>{
    const sid = effectiveStageId(it);
    byStage[sid] = byStage[sid] || {done:0,total:0,name:'Unmapped to Stage'};
    byStage[sid].total++;
    const projCtx = it.level==='Project Level' ? S.currentProject : null;
    if(effectiveStatus(it,projCtx)==='Compliant / Completed') byStage[sid].done++;
  });

  const topOverdue = items.map(it=>{
    const projCtx = it.level==='Project Level' ? S.currentProject : null;
    const tr = getTracking(it, projCtx);
    const st = effectiveStatus(it, projCtx);
    return {it, tr, st, d: tr.next_due_date?daysUntil(tr.next_due_date):null};
  }).filter(x=>x.st==='Overdue').sort((a,b)=>(a.d??0)-(b.d??0)).slice(0,8);

  return `
    <div class="section-title">Overview — ${S.currentProject==='ENTITY'?'Entity-level':esc((S.projects[S.currentProject]&&S.projects[S.currentProject].name)||S.currentProject)}</div>
    <div class="grid grid-stats" style="margin-bottom:22px;">
      <div class="stat-tile"><div class="num">${total}</div><div class="label">Total compliance items</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--ok)">${completed}</div><div class="label">Compliant / completed</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--bad)">${overdue}</div><div class="label">Overdue</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--warn)">${due7}</div><div class="label">Due in 7 days</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--warn)">${due30}</div><div class="label">Due in 30 days</div></div>
    </div>

    <div class="dash-cols">
      <div class="card">
        <h3 style="margin-bottom:10px;">By status</h3>
        ${STATUS_LIST.map(s=>pctBar(s, counts[s]||0, total, true, STATUS_DEFS[s]?`var(--${STATUS_DEFS[s].cls})`:null)).join('')}
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px;">Top overdue items</h3>
        ${topOverdue.length? `<table class="simple"><tr><th>ID</th><th>Description</th><th>Days overdue</th></tr>${
          topOverdue.map(x=>`<tr data-open="${esc(x.it.compliance_id)}"><td class="mono">${esc(x.it.compliance_id)}</td><td>${esc((x.it.brief_description||'').slice(0,46))}</td><td class="mono" style="color:var(--bad)">${Math.abs(x.d)}</td></tr>`).join('')
        }</table>` : '<div style="color:var(--text-muted); font-size:12.5px;">No overdue items right now.</div>'}
      </div>
    </div>

    <div class="section-title">Completion % by stage</div>
    <div class="card">
      ${Object.keys(byStage).map(sid=>pctBar(byStage[sid].name, byStage[sid].done, byStage[sid].total)).join('')}
    </div>

    <div class="section-title">Completion % by department</div>
    <div class="card">
      ${Object.keys(byDept).map(d=>pctBar(d, byDept[d].done, byDept[d].total)).join('')}
    </div>
  `;
}

/* ============================= STAGES ============================= */
function renderStages(){
  const grouped = {};
  S.stages.forEach(s=>grouped[s.id]={stage:s, items:[]});
  S.items.forEach(it=>{
    const sid = effectiveStageId(it);
    if(!grouped[sid]) grouped[sid]={stage:{id:sid,name:sid,order:999}, items:[]};
    grouped[sid].items.push(it);
  });
  const ordered = Object.values(grouped).sort((a,b)=>a.stage.order-b.stage.order);

  return `
    <div class="legend">
      ${Object.entries(STATUS_DEFS).map(([k,v])=>`<span><i style="background:var(--${v.cls})"></i>${k}</span>`).join('')}
    </div>
    ${ordered.map(g=>{
      const sid = g.stage.id;
      const done = g.items.filter(it=>effectiveStatus(it, it.level==='Project Level'?S.currentProject:null)==='Compliant / Completed').length;
      const pct = g.items.length? Math.round(done/g.items.length*100):0;
      return `
      <div class="stage-block ${sid==='S1'?'open':''}" data-stage="${esc(sid)}">
        <div class="stage-head" data-toggle="${esc(sid)}">
          <span class="stage-chevron">▶</span>
          <h3>${esc(g.stage.name)}</h3>
          <div class="stage-progress"><div class="bar-track"><div class="bar-seg" style="width:${pct}%;background:var(--accent)"></div></div></div>
          <div class="stage-count">${done}/${g.items.length} done</div>
        </div>
        <div class="stage-items">
          <div class="item-row-header"><div>ID</div><div>Description</div><div>Authority</div><div>Owner</div><div>Next due</div><div>Status</div></div>
          ${g.items.map(it=>{
            const projCtx = it.level==='Project Level' ? S.currentProject : null;
            const tr = getTracking(it, projCtx);
            const st = effectiveStatus(it, projCtx);
            const sdef = STATUS_DEFS[st]||STATUS_DEFS['Not Started'];
            return `<div class="item-row" data-open="${esc(it.compliance_id)}">
              <div class="idcell" data-lbl="ID">${esc(it.compliance_id)}</div>
              <div class="desc" data-lbl="Description" title="${esc(it.brief_description)}">${esc(it.brief_description||'')}</div>
              <div class="muted" data-lbl="Authority">${esc(it.authority_norm)}</div>
              <div class="muted" data-lbl="Owner">${esc(it.owner)}</div>
              <div class="muted mono" data-lbl="Next due">${tr.next_due_date?fmtDate(tr.next_due_date):'—'}</div>
              <div data-lbl="Status"><span class="badge ${sdef.cls}"><span class="ic">${sdef.ic}</span>${st}</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  `;
}

/* ============================= CALENDAR ============================= */
function monthMatrix(year, month){
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const days = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=days; d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function itemsByDueDate(){
  const map = {}; const undated=[];
  S.items.forEach(it=>{
    const projCtx = it.level==='Project Level' ? S.currentProject : null;
    const tr = getTracking(it, projCtx);
    if(tr.next_due_date){
      map[tr.next_due_date] = map[tr.next_due_date]||[];
      map[tr.next_due_date].push({it, tr});
    } else if(it.due_date_parse_status==='undated_by_nature' || it.due_date_parse_status==='due_date_to_be_set' || it.due_date_parse_status==='unparsed'){
      undated.push({it, tr});
    }
  });
  return {map, undated};
}
function renderCalendar(){
  const y = S.calMonth.getFullYear(), m = S.calMonth.getMonth();
  const cells = monthMatrix(y,m);
  const {map, undated} = itemsByDueDate();
  const todayStr = todayISO();
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthLabel = S.calMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  function dayCell(d){
    if(d===null) return '<div class="cal-cell off"></div>';
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const entries = map[dateStr]||[];
    const isToday = dateStr===todayStr;
    const shown = entries.slice(0,3);
    return `<div class="cal-cell ${isToday?'today':''}">
      <div class="dnum">${d}</div>
      ${shown.map(e=>{
        const st = effectiveStatus(e.it, e.it.level==='Project Level'?S.currentProject:null);
        const sdef = STATUS_DEFS[st]||STATUS_DEFS['Not Started'];
        return `<div class="cal-chip badge ${sdef.cls}" data-open="${esc(e.it.compliance_id)}" title="${esc(e.it.compliance_id+' — '+e.it.brief_description)}">${esc(e.it.compliance_id)}</div>`;
      }).join('')}
      ${entries.length>3?`<div class="cal-more">+${entries.length-3} more</div>`:''}
    </div>`;
  }

  return `
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <button class="btn" id="calPrev">‹</button>
      <h3 style="min-width:170px;">${monthLabel}</h3>
      <button class="btn" id="calNext">›</button>
      <button class="btn" id="calToday">Today</button>
      <select class="pill" id="calFilterLevel"><option value="">All levels</option><option value="Entity Level">Entity Level</option><option value="Project Level">Project Level</option></select>
      <button class="btn primary" id="icsExport" style="margin-left:auto;">Export .ics</button>
    </div>
    <div class="legend">${Object.entries(STATUS_DEFS).map(([k,v])=>`<span><i style="background:var(--${v.cls})"></i>${k}</span>`).join('')}</div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(dayCell).join('')}
    </div>
    <div class="undated-panel card">
      <h3 style="margin-bottom:8px;">Event-based / Ongoing — no fixed date (${undated.length})</h3>
      <div>${undated.slice(0,80).map(e=>`<span class="undated-chip" data-open="${esc(e.it.compliance_id)}">${esc(e.it.compliance_id)} · ${esc((e.it.brief_description||'').slice(0,40))}</span>`).join('')}</div>
      ${undated.length>80?`<div class="muted" style="margin-top:6px;color:var(--text-muted)">+${undated.length-80} more — refine in the Master Register.</div>`:''}
    </div>
  `;
}
function buildICS(){
  const {map} = itemsByDueDate();
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Compliance Tracker//EN'];
  Object.keys(map).forEach(dateStr=>{
    map[dateStr].forEach(({it})=>{
      const dt = dateStr.replace(/-/g,'');
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+it.compliance_id+'-'+dateStr+'@compliance-tracker');
      lines.push('DTSTART;VALUE=DATE:'+dt);
      lines.push('SUMMARY:'+it.compliance_id+' — '+(it.brief_description||'').replace(/\n/g,' ').slice(0,120));
      lines.push('DESCRIPTION:'+(it.action_required||'').replace(/\n/g,' ').slice(0,500).replace(/,/g,'\\,'));
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function regRowValue(it, col){
  if(col==='status') return effectiveStatus(it, it.level==='Project Level'?S.currentProject:null);
  return it[col];
}
function refreshRegisterBody(){
  const q = (document.getElementById('regSearch')?.value||'').toLowerCase();
  const dept = document.getElementById('regDept')?.value||'';
  const level = document.getElementById('regLevel')?.value||'';
  let rows = S.items.filter(it=>{
    if(dept && it.department!==dept) return false;
    if(level && it.level!==level) return false;
    if(q){
      const hay = [it.compliance_id,it.department,it.brief_description,it.regulation,it.authority_norm,it.owner].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('regBody').innerHTML = rows.map(it=>`<tr data-open="${esc(it.compliance_id)}">${S.registerCols.map(c=>`<td title="${esc(regRowValue(it,c))}">${esc(regRowValue(it,c))}</td>`).join('')}</tr>`).join('');
  document.getElementById('regCount').textContent = `${rows.length} of ${S.items.length} items`;
  window._regRows = rows;
}

/* ============================= DATA QUALITY ============================= */
function renderDQ(){
  const unparsedDue = S.items.filter(i=>i.due_date_parse_status==='unparsed');
  const toBeSet = S.items.filter(i=>i.due_date_parse_status==='due_date_to_be_set');
  const noOwner = S.items.filter(i=>i.owner==='Unassigned');
  const noApprover = S.items.filter(i=>i.approver==='Unassigned');
  const unmapped = S.items.filter(i=>effectiveStageId(i)==='UNMAPPED');
  const otherFreq = S.items.filter(i=>i.frequency_norm==='Other / Unparsed');
  const brokenId = S.items.filter(i=>i.compliance_id_source_formula_broken);

  function group(title, list, note){
    return `<div class="dq-group"><h3>${esc(title)} <span class="mono" style="color:var(--text-muted); font-weight:400;">(${list.length})</span></h3>
      ${note?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${note}</div>`:''}
      <div class="dq-list">${list.slice(0,40).map(it=>`<div class="dq-item" data-open="${esc(it.compliance_id)}"><span class="mono">${esc(it.compliance_id)}</span><span>${esc((it.brief_description||'').slice(0,70))}</span></div>`).join('')}
      ${list.length>40?`<div class="dq-item" style="color:var(--text-muted)">+${list.length-40} more — see Master Register.</div>`:''}
      </div></div>`;
  }
  return `
    ${group('Compliance ID / Sr No formula broken in source (recomputed)', brokenId, 'The Excel\'s own Sr No formula breaks from row 19 onward (a `=#REF!+1` chain). IDs shown throughout this app are recomputed, not guessed — same logic as the sheet\'s formula, applied per department.')}
    ${group('Due date unparsed (free text, not auto-converted)', unparsedDue, 'Open the item and set a concrete next due date manually.')}
    ${group('Due date to be set (blank in source)', toBeSet)}
    ${group('Owner unassigned', noOwner)}
    ${group('Approver unassigned', noApprover)}
    ${group('Unmapped to a process stage', unmapped, 'No stage definition exists in the source sheet for these items — only the Sanctioning sequence has one.')}
    ${group('Frequency text not recognized by the normalizer', otherFreq)}
  `;
}

/* ---------- Documents (uploaded files per required document) ---------- */
const OTHER_DOC = '__other__';
function requiredDocs(it){
  const seen = new Set(), out = [];
  String(it.forms_documents||'').split(/[\n;,]+/).forEach(p=>{
    const t = p.replace(/^\s*(and|&)\s+/i,'').replace(/[.\s]+$/,'').trim();
    if(t.length<3 || t.length>120 || seen.has(t.toLowerCase())) return;
    seen.add(t.toLowerCase()); out.push(t);
  });
  return out;
}
function fmtSize(n){ return n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }

async function loadDocs(it, projCtx){
  const key = trackingKey(it, projCtx);
  let docs = [];
  try{ docs = (await api('GET', '/api/documents?key='+encodeURIComponent(key))).map(d=>({id:d.id, ...d.data})); }
  catch(e){ const b=document.getElementById('docsBox'); if(b) b.textContent='Could not load documents: '+e.message; return; }
  if(currentDrawerItem !== it) return;
  renderDocsBox(it, projCtx, docs);
}

function renderDocsBox(it, projCtx, docs){
  const box = document.getElementById('docsBox');
  if(!box) return;
  const editable = canEditTracking();
  const req = requiredDocs(it);
  const byName = n=>docs.filter(d=>d.doc_name.toLowerCase()===n.toLowerCase());
  const extra = docs.filter(d=>!req.some(n=>n.toLowerCase()===d.doc_name.toLowerCase()));
  const doneCount = req.filter(n=>byName(n).length).length;
  box.style.color = '';
  box.innerHTML = `
    ${req.length?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${doneCount} of ${req.length} required documents uploaded</div>
    <div>${req.map(n=>{ const c=byName(n).length; return `<div class="doc-check ${c?'done':'pending'}"><span class="st">${c?'✓':'○'}</span><span style="flex:1">${esc(n)}</span><span style="color:var(--text-muted);font-size:11.5px;">${c?c+' file'+(c>1?'s':''):'Not uploaded'}</span></div>`; }).join('')}</div>`
    :'<div style="font-size:12px;color:var(--text-muted);">No specific documents are listed for this item. Use "Other document" to upload one.</div>'}
    <div class="field" style="margin-top:12px;"><label>Select a document</label>
      <select id="docSelect"><option value="">— Choose a document —</option>${req.map(n=>`<option value="${esc(n)}" ${docSel===n?'selected':''}>${esc(n)}</option>`).join('')}<option value="${OTHER_DOC}" ${docSel===OTHER_DOC?'selected':''}>Other document…</option></select>
    </div>
    ${editable?`<div id="docUploadRow" ${docSel?'':'hidden'}>
      <input type="text" id="docOther" placeholder="Document name" style="margin-bottom:8px;" ${docSel===OTHER_DOC?'':'hidden'}>
      <div class="doc-upload" style="margin-top:0;">
        <input type="file" id="docFile" accept=".pdf,.doc,.docx">
        <button class="btn primary" id="docUploadBtn" type="button">Upload</button>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">PDF or Word (.doc, .docx) · max 15 MB</div>
    </div>`:'<div class="readonly-note">Your current role (Read-only) cannot upload documents.</div>'}
    <div id="trackHint" class="prose-meta" style="margin-top:12px;" ${docSel?'hidden':''}>Select a document above to upload it and update the tracking status.</div>
    <div style="margin-top:14px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);margin-bottom:4px;">Uploaded files (${docs.length})</div>
      ${docs.length ? docs.slice().sort((a,b)=>b.uploaded_at.localeCompare(a.uploaded_at)).map(d=>`<div class="doc-file">
        <div style="min-width:0"><div><b>${esc(d.doc_name)}</b></div><div class="meta">${esc(d.file_name)} · ${fmtSize(d.size)} · ${esc(d.uploaded_by)} · ${new Date(d.uploaded_at).toLocaleString()}</div></div>
        <div style="white-space:nowrap"><a class="btn sm" href="/files/${esc(d.file_id)}" style="text-decoration:none;display:inline-block;">Download</a>
        ${editable?`<button class="btn sm" data-docdel="${esc(d.id)}" type="button">Delete</button>`:''}</div></div>`).join('') : '<div style="font-size:12px;color:var(--text-muted);">Nothing uploaded yet.</div>'}
    </div>`;
  const sel = document.getElementById('docSelect');
  const other = document.getElementById('docOther');
  sel.onchange = ()=>{
    docSel = sel.value;
    document.getElementById('trackPanel').hidden = !docSel;
    document.getElementById('trackHint').hidden = !!docSel;
    const row = document.getElementById('docUploadRow');
    if(row){ row.hidden = !docSel; other.hidden = docSel!==OTHER_DOC; }
  };
  if(editable){
    document.getElementById('docUploadBtn').onclick = async ()=>{
      const file = document.getElementById('docFile').files[0];
      const name = sel.value===OTHER_DOC ? other.value.trim() : sel.value;
      if(!name){ toast(sel.value===OTHER_DOC ? 'Enter a document name.' : 'Select a document.'); return; }
      if(!file){ toast('Choose a file to upload.'); return; }
      if(file.size > 15*1024*1024){ toast('File is larger than 15 MB.'); return; }
      const btn = document.getElementById('docUploadBtn'); btn.disabled = true; btn.textContent = 'Uploading…';
      try{
        const q = new URLSearchParams({key: trackingKey(it, projCtx), compliance_id: it.compliance_id, project_id: projCtx||'', doc_name: name, file_name: file.name});
        const r = await fetch('/files?'+q, {method:'POST', headers:{'Content-Type':'application/octet-stream','X-Requested-With':'fetch'}, body:file});
        if(r.status===401){ location.href='/login.html'; return; }
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
        toast('Document uploaded.');
      }catch(e){ toast('Upload failed: '+e.message); }
      loadDocs(it, projCtx);
    };
  }
  box.querySelectorAll('[data-docdel]').forEach(b=>b.onclick = async ()=>{
    if(!window.confirm('Delete this uploaded file?')) return;
    try{
      const r = await fetch('/files/'+encodeURIComponent(b.dataset.docdel), {method:'DELETE', headers:{'X-Requested-With':'fetch'}});
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
      toast('Deleted.');
    }catch(e){ toast('Delete failed: '+e.message); }
    loadDocs(it, projCtx);
  });
}

function closeDrawer(){
  currentDrawerItem = null;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  if(auditUnsub){ auditUnsub(); auditUnsub=null; }
}

/* ============================= EVENT WIRING ============================= */
function attachViewHandlers(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>openDrawer(el.getAttribute('data-open')));
  });
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const block = el.closest('.stage-block');
      block.classList.toggle('open');
    });
  });
  if(S.view==='calendar'){
    document.getElementById('calPrev').onclick = ()=>{ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()-1, 1); render(); };
    document.getElementById('calNext').onclick = ()=>{ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+1, 1); render(); };
    document.getElementById('calToday').onclick = ()=>{ S.calMonth = new Date(); render(); };
    document.getElementById('icsExport').onclick = async ()=>{
      const ics = buildICS();
      download('compliance-calendar.ics', ics, 'text/calendar');
    };
  }
  if(S.view==='register'){
    refreshRegisterBody();
    ['regSearch','regDept','regLevel'].forEach(id=>document.getElementById(id).addEventListener('input', refreshRegisterBody));
    document.querySelectorAll('[data-col]').forEach(cb=>cb.addEventListener('change', ()=>{
      const col = cb.getAttribute('data-col');
      if(cb.checked){ if(!S.registerCols.includes(col)) S.registerCols.push(col); }
      else S.registerCols = S.registerCols.filter(c=>c!==col);
      render();
    }));
    document.getElementById('regExport').onclick = async ()=>{
      const rows = window._regRows||[];
      const header = S.registerCols.map(c=>ALL_COLS.find(x=>x[0]===c)[1]);
      const csv = [header.join(',')].concat(rows.map(it=>S.registerCols.map(c=>{
        const v = String(regRowValue(it,c)||'').replace(/"/g,'""');
        return `"${v}"`;
      }).join(','))).join('\r\n');
      download('compliance-register.csv', '﻿'+csv, 'text/csv;charset=utf-8');
    };
  }
  if(S.view==='users') attachUserHandlers();
  if(S.view==='settings') attachSettingsHandlers();
  if(S.view==='projects'){
    const btn = document.getElementById('npSave');
    if(btn) btn.onclick = ()=>{
      const name = document.getElementById('npName').value.trim();
      if(!name){ toast('Enter a project name.'); return; }
      const id = 'proj_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'_'+Date.now().toString(36);
      saveProject(id, {name, rera_no: document.getElementById('npRera').value.trim(), current_stage: document.getElementById('npStage').value.trim(), created_at: new Date().toISOString()});
    };
  }
}

/* ============================= USERS (admin) ============================= */
const ROLE_LABELS = {admin:'Admin', head:'Compliance Head', owner:'Owner', approver:'Approver', readonly:'Read-only'};

async function loadUsers(){
  try{ S.users = await api('GET', '/auth/users'); }catch(e){ S.users = []; toast(e.message); }
  if(S.view==='users') render();
}

function renderUsers(){
  if(!S.users) return '<div class="empty-state">Loading users…</div>';
  const roleOpts = sel=>Object.entries(ROLE_LABELS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
  return `
    <div class="section-title">Users</div>
    <div class="card" style="margin-bottom:18px;">
      <table class="simple"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
      ${S.users.map(u=>`<tr>
        <td>${esc(u.name)}</td><td class="mono">${esc(u.email)}</td>
        <td><select data-urole="${esc(u.email)}" ${u.email===ME.email?'disabled':''}>${roleOpts(u.role)}</select></td>
        <td>${u.active?'Active':'<span style="color:var(--bad)">Disabled</span>'}</td>
        <td style="white-space:nowrap;">
          <button class="btn" data-upw="${esc(u.email)}">Reset password</button>
          ${u.email===ME.email?'':`<button class="btn" data-uactive="${esc(u.email)}" data-to="${u.active?0:1}">${u.active?'Disable':'Enable'}</button>`}
        </td></tr>`).join('')}
      </table>
    </div>
    <div class="section-title">Add user</div>
    <div class="card">
      <div class="field"><label>Name</label><input id="nuName"></div>
      <div class="field"><label>Email</label><input id="nuEmail" type="email" autocomplete="off"></div>
      <div class="field"><label>Role</label><select id="nuRole">${roleOpts('readonly')}</select></div>
      <div class="field"><label>Temporary password (min 10 characters)</label><input id="nuPw" type="text" autocomplete="off"></div>
      <button class="btn primary" id="nuSave">Add user</button>
    </div>`;
}

function attachUserHandlers(){
  document.querySelectorAll('[data-urole]').forEach(el=>el.addEventListener('change', async ()=>{
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(el.dataset.urole), {role: el.value}); toast('Role updated.'); }
    catch(e){ toast(e.message); }
    loadUsers();
  }));
  document.querySelectorAll('[data-uactive]').forEach(el=>el.addEventListener('click', async ()=>{
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(el.dataset.uactive), {active: el.dataset.to==='1'}); toast('Updated.'); }
    catch(e){ toast(e.message); }
    loadUsers();
  }));
  document.querySelectorAll('[data-upw]').forEach(el=>el.addEventListener('click', async ()=>{
    const pw = window.prompt('New temporary password for '+el.dataset.upw+' (min 10 characters):');
    if(!pw) return;
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(el.dataset.upw), {password: pw}); toast('Password reset. They are signed out everywhere.'); }
    catch(e){ toast(e.message); }
  }));
  const save = document.getElementById('nuSave');
  if(save) save.onclick = async ()=>{
    try{
      await api('POST', '/auth/users', {
        name: document.getElementById('nuName').value, email: document.getElementById('nuEmail').value,
        role: document.getElementById('nuRole').value, password: document.getElementById('nuPw').value});
      toast('User added.'); S.users = null; render(); loadUsers();
    }catch(e){ toast(e.message); }
  };
}

function renderSettings(){

    <div class="card" style="max-width:420px;">
      <h3 style="margin-bottom:4px;">Change password</h3>
      <div style="color:var(--text-muted);font-size:12px;margin-bottom:12px;">Signed in as ${esc(ME.name)} (${esc(ME.email)})</div>
      <form id="pwForm">

        <div class="field"><label>New password (min 10 characters)</label><input type="password" id="pwNew" autocomplete="new-password" required minlength="10"></div>
        <button class="btn primary" type="submit" style="margin-top:12px;">Change password</button>
      </form>
    </div>`;
}

function attachSettingsHandlers(){
  const form = document.getElementById('pwForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    try{
      await api('POST', '/auth/password', {current: document.getElementById('pwCur').value, next: document.getElementById('pwNew').value});
      form.reset(); toast('Password changed.');
    }catch(err){ toast(err.message); }
  });
}
